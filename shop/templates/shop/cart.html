{% extends 'base.html' %}

{% block content %}
<h2>Your Shopping Cart</h2>
<table class="table">
    <tr>
        <th>Product</th>
        <th>Quantity</th>
        <th>Total</th>
        <th>Action</th>
    </tr>
    {% for order in orders %}
    <tr>
        <td>{{ order.product.name }}</td>
        <td>
            <a href="{% url 'decrease_cart' order.id %}" class="btn btn-secondary btn-sm">-</a>
            {{ order.quantity }}
            <a href="{% url 'add_to_cart' order.product.id %}" class="btn btn-secondary btn-sm">+</a>
        </td>
        <td>₹{{ order.total_price }}</td>
        <td>
            <a href="{% url 'checkout' order.product.id %}" class="btn btn-primary btn-sm">Checkout</a>
            <a href="{% url 'remove_from_cart' order.id %}" class="btn btn-danger btn-sm">Remove</a>
        </td>
    </tr>
    {% endfor %}
</table>
<h3>Total: ₹{{ total_amount }}</h3>
{% endblock %}
