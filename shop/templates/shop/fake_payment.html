{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="card p-4 mx-auto" style="max-width: 500px;">
        <h2 class="text-center mb-4">💳 Secure Payment</h2>

        <div class="alert alert-info text-center">
            <h5>Total Amount to Pay: <strong>₹{{ amount_to_pay }}</strong></h5>
            <p class="mb-0">Product: {{ product.name }}</p>
        </div>

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label for="shipping_address" class="form-label">Shipping Address</label>
                <textarea name="shipping_address" class="form-control" rows="3" required
                    placeholder="Enter delivery address..."></textarea>
            </div>

            <div class="mb-3">
                <label for="card_number" class="form-label">Card Number</label>
                <input type="text" name="card_number" required class="form-control" placeholder="1234 5678 9101 1121"
                    maxlength="16">
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="expiry_date" class="form-label">Expiry Date</label>
                    <input type="text" name="expiry_date" required class="form-control" placeholder="MM/YY">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="cvv" class="form-label">CVV</label>
                    <input type="password" name="cvv" required class="form-control" placeholder="123" maxlength="3">
                </div>
            </div>

            <button type="submit" class="btn btn-success w-100 btn-lg">Pay ₹{{ amount_to_pay }}</button>
        </form>
    </div>
</div>
{% endblock %}
